name: CI/CD Docker

on:
  push:
    branches:
      - main
      - feature/db-seeder

jobs:
  build:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: echo "${{ secrets.PROD_ENV }}" > .env

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/class_ci-cd:${{ github.sha }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/class_ci-cd:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/deploy'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/class_ci-cd:${{ github.sha }}
            docker rm -f class_ci-cd || true
            docker run -d -p 3000:3000 --name class_ci-cd ${{ secrets.DOCKER_HUB_USERNAME }}/class_ci-cd:${{ github.sha }}

  notification:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Deploy successful!
            Actor: ${{ github.actor }}
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}