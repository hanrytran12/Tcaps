version: "3.9"

services:
  tcaps:
    image: hanryhuy/tcaps:latest
    container_name: tcaps
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - tcapdb
    networks:
      - tcap

  tcapdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tcapdb
    env_file:
      - .env
    ports:
      - "1433:1433"
    volumes:
      - tcapdbdata:/var/opt/mssql
    networks:
      - tcap

volumes:
  tcapdbdata:


networks:
  tcap: